<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Selesai - Digital Exam Portal</title>

  <!-- Bootstrap 5.3 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --primary-navy: #0d1b2a;
      --navy-surface: #1b263b;
      --bg-slate: #f8fafc;
      --white: #ffffff;
      --border-color: #e2e8f0;
    }

    body {
      background-color: var(--bg-slate);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
    }

    .card-finish {
      width: 100%;
      max-width: 500px;
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: 1.25rem;
      box-shadow: 0 20px 40px -15px rgba(13, 27, 42, 0.15);
      overflow: hidden;
      text-align: center;
    }

    .header-band {
      background-color: var(--primary-navy);
      padding: 35px 20px;
      color: var(--white);
    }

    .icon-success-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #10b981;
      color: var(--white);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      box-shadow: 0 0 0 8px rgba(16, 185, 129, 0.2);
      margin-bottom: 12px;
    }

    .text-navy {
      color: var(--primary-navy) !important;
    }

    .btn-navy {
      background-color: var(--primary-navy);
      color: var(--white);
      font-weight: 600;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.65rem;
      transition: all 0.2s;
    }

    .btn-navy:hover {
      background-color: var(--navy-surface);
      color: var(--white);
    }
  </style>
</head>
<body class="p-3 p-md-4">

<div class="card card-finish">
  
  <div class="header-band">
    <div class="icon-success-circle">
      <i class="bi bi-check-lg"></i>
    </div>
    <h3 class="fw-bold mb-1">UJIAN TELAH SELESAI</h3>
    <p class="small text-light opacity-75 mb-0">Status asesmen dan catatan kehadiran Anda telah terekam.</p>
  </div>

  <div class="card-body p-4 p-md-5">

    <!-- Tabel Rekap Singkat -->
    <div class="bg-light rounded-3 p-3 mb-4 text-start border">
      <div class="row g-2 small align-items-center">
        <div class="col-4 text-muted">Mata Pelajaran</div>
        <div class="col-8 fw-bold text-navy" id="resMapel">-</div>

        <div class="col-4 text-muted">Nama Siswa</div>
        <div class="col-8 fw-bold text-navy" id="resNama">-</div>

        <div class="col-4 text-muted">Ruang / Kelas</div>
        <div class="col-8 text-navy"><span id="resRuang">-</span> / <span id="resKelas">-</span></div>

        <div class="col-4 text-muted">Total Pelanggaran</div>
        <div class="col-8">
          <span class="badge bg-light text-navy border px-3 py-1 fw-bold fs-6" id="resPelanggaranBadge">0</span>
        </div>
      </div>
    </div>

    <p class="small text-muted mb-4">
      Terima kasih telah mengerjakan ujian dengan tertib dan jujur. Silakan letakkan perangkat Anda di meja atau melapor kepada pengawas ruang.
    </p>

    <button onclick="keluarSesiKeBeranda()" class="btn btn-navy w-100 d-flex align-items-center justify-content-center gap-2">
      <i class="bi bi-box-arrow-left"></i>
      <span>Kembali ke Halaman Depan</span>
    </button>

  </div>
</div>

<script>
  // Kunci Riwayat Navigasi Browser
  history.pushState(null, "", location.href);
  window.onpopstate = function () {
    history.pushState(null, "", location.href);
  };

  window.addEventListener("DOMContentLoaded", () => {
    const nama = sessionStorage.getItem("exam_nama");
    const kelas = sessionStorage.getItem("exam_kelas");
    const ruang = sessionStorage.getItem("exam_ruang");
    const mapel = sessionStorage.getItem("exam_mapel");
    const pelanggaran = parseInt(sessionStorage.getItem("exam_pelanggaran") || "0", 10);

    if (!nama) {
      window.location.replace("index.html");
      return;
    }

    document.getElementById("resNama").innerText = nama;
    document.getElementById("resKelas").innerText = kelas;
    document.getElementById("resRuang").innerText = ruang;
    document.getElementById("resMapel").innerText = mapel;

    // Menampilkan murni angka pelanggaran tanpa teks tambahan
    document.getElementById("resPelanggaranBadge").innerText = pelanggaran;

    // Bersihkan parameter form dan token rahasia
    sessionStorage.removeItem("exam_link_form");
    sessionStorage.removeItem("exam_token");
    sessionStorage.removeItem("exam_token_reset");
    sessionStorage.removeItem("exam_is_locked");
  });

  function keluarSesiKeBeranda() {
    sessionStorage.clear();
    window.location.replace("index.html");
  }
</script>

</body>
</html>
